[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-rag"
version = "0.1.0"
description = "Enterprise Retrieval-Augmented Generation for PDF documents on Databricks"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
  {name = "kingoffrisco"},
]
keywords = ["rag", "pdf", "databricks", "langchain", "llm", "vector-search"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "pyyaml>=6.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "langchain-community>=0.3.0",
  "pdfplumber>=0.11.0",
  "rank-bm25>=0.2.2",
  "mlflow>=2.14.0",
]

[project.optional-dependencies]
local = [
  "faiss-cpu>=1.8.0",
  "langchain-huggingface>=0.1.0",
  "sentence-transformers>=3.0.0",
]
chroma = [
  "langchain-chroma>=0.1.0",
  "chromadb>=0.5.0",
]
databricks = [
  "databricks-vectorsearch>=0.40",
  "langchain-databricks>=0.3.0",
]
openai = [
  "langchain-openai>=0.2.0",
  "openai>=1.0.0",
]
eval = [
  "ragas>=0.1.0",
  "datasets>=2.20.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "faiss-cpu>=1.8.0",
  "langchain-huggingface>=0.1.0",
  "sentence-transformers>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/kingoffrisco/PDF_RAG"
Repository = "https://github.com/kingoffrisco/PDF_RAG"
Issues = "https://github.com/kingoffrisco/PDF_RAG/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/pdf_rag"]
